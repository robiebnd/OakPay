spring:
  application:
    name: gateway-service

  data:
    redis:
      host: ${OAKPAY_REDIS_HOST:127.0.0.1}
      port: ${OAKPAY_REDIS_PORT:6379}

  cloud:
    gateway:
      server:
        webflux:

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${OAKPAY_RATE_LIMIT_PER_SECOND:60}
                redis-rate-limiter.burstCapacity: ${OAKPAY_RATE_LIMIT_BURST:120}
                key-resolver: "#{@ipKeyResolver}"

          routes:
            - id: auth-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/auth/**

            - id: kyc-auth-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/kyc/**

            - id: notification-auth-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/notifications/**

            # OakPay Admin endpoints
            - id: admin-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/admin/**

            - id: wallet-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/wallets/**

            - id: trading-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/trading/**

            - id: p2p-trading-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/p2p/**

server:
  port: 8082

  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always