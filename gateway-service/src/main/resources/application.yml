spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/auth/**

            - id: wallet-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/wallets/**

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
