spring:
  application:
    name: trading-service
  datasource:
    url: ${OAKPAY_DB_URL:jdbc:postgresql://127.0.0.1:5432/oakpay_trading}
    username: ${OAKPAY_DB_USERNAME:oakpay}
    password: ${OAKPAY_DB_PASSWORD:oakpay_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: false

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,scheduledtasks
  endpoint:
    health:
      show-details: always

oakpay:
  jwt:
    secret: ${OAKPAY_JWT_SECRET:oakpay-development-secret-change-before-production-2026}
  wallet:
    base-url: ${OAKPAY_WALLET_URL:http://localhost:8084}
  internal-secret: ${OAKPAY_INTERNAL_SECRET:oakpay-internal-development-secret-change-before-production}
  admin:
    dispute-secret: ${OAKPAY_ADMIN_DISPUTE_SECRET:oakpay-admin-dispute-development-secret-change-before-production}
  trading:
    fee-rate: ${OAKPAY_TRADING_FEE_RATE:0.001}
  p2p:
    commission-rate: ${OAKPAY_P2P_COMMISSION_RATE:0.001}
