services:

  postgres:
    image: postgres:16
    container_name: oakpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oakpay
      POSTGRES_USER: oakpay
      POSTGRES_PASSWORD: oakpay_dev_password
    ports:
      - "5432:5432"
    volumes:
      - oakpay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oakpay -d oakpay"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oakpay-network

  redis:
    image: redis:7-alpine
    container_name: oakpay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - oakpay-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oakpay-network

volumes:
  oakpay-postgres-data:
  oakpay-redis-data:

networks:
  oakpay-network:
    driver: bridge