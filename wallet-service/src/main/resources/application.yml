spring:
  application:
    name: wallet-service

  datasource:
    url: ${OAKPAY_DB_URL:jdbc:postgresql://127.0.0.1:5432/oakpay_wallet}
    username: ${OAKPAY_DB_USERNAME:oakpay}
    password: ${OAKPAY_DB_PASSWORD:oakpay_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: false

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

oakpay:
  jwt:
    secret: ${OAKPAY_JWT_SECRET:oakpay-development-secret-change-before-production-2026}
  internal-secret: ${OAKPAY_INTERNAL_SECRET:oakpay-internal-development-secret-change-before-production}
  auth:
    base-url: ${OAKPAY_AUTH_URL:http://localhost:8083}
  test-addresses:
    enabled: ${OAKPAY_TEST_ADDRESSES_ENABLED:true}
  custody:
    bitgo:
      webhook-base-url: ${OAKPAY_BITGO_WEBHOOK_BASE_URL:}
      base-url: ${OAKPAY_BITGO_BASE_URL:https://app.bitgo.com}
      access-token: ${OAKPAY_BITGO_ACCESS_TOKEN:}
      wallet-passphrase: ${OAKPAY_BITGO_WALLET_PASSPHRASE:}
      btc:
        coin: ${OAKPAY_BITGO_BTC_COIN:btc}
        wallet-id: ${OAKPAY_BITGO_BTC_WALLET_ID:6aaf14223046b7b19896847319e59250}
        required-confirmations: ${OAKPAY_BITGO_BTC_REQUIRED_CONFIRMATIONS:3}
      usdt-tron:
        coin: ${OAKPAY_BITGO_USDT_TRON_COIN:trx:usdt}
        wallet-id: ${OAKPAY_BITGO_USDT_TRON_WALLET_ID:6aaf10cdbc1760e65c6fc420d321e95c}
        required-confirmations: ${OAKPAY_BITGO_USDT_TRON_REQUIRED_CONFIRMATIONS:20}
    provider-name: ${OAKPAY_CUSTODY_PROVIDER_NAME:}
    webhook-secret: ${OAKPAY_CUSTODY_WEBHOOK_SECRET:}
    webhook-tolerance-seconds: ${OAKPAY_CUSTODY_WEBHOOK_TOLERANCE_SECONDS:300}
    reconciliation:
      enabled: ${OAKPAY_CUSTODY_RECONCILIATION_ENABLED:true}
      fixed-delay-ms: ${OAKPAY_CUSTODY_RECONCILIATION_FIXED_DELAY_MS:60000}
      initial-delay-ms: ${OAKPAY_CUSTODY_RECONCILIATION_INITIAL_DELAY_MS:30000}
      older-than-minutes: ${OAKPAY_CUSTODY_RECONCILIATION_OLDER_THAN_MINUTES:5}
