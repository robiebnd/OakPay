spring:
  application:
    name: wallet-service

  datasource:
    url: ${OAKPAY_DB_URL:jdbc:postgresql://127.0.0.1:5432/oakpay_wallet}
    username: ${OAKPAY_DB_USERNAME:oakpay}
    password: ${OAKPAY_DB_PASSWORD:oakpay_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: false

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

oakpay:
  jwt:
    secret: ${OAKPAY_JWT_SECRET:oakpay-development-secret-change-before-production-2026}
  internal-secret: ${OAKPAY_INTERNAL_SECRET:oakpay-internal-development-secret-change-before-production}
  auth:
    base-url: ${OAKPAY_AUTH_URL:http://localhost:8083}
  test-addresses:
    enabled: ${OAKPAY_TEST_ADDRESSES_ENABLED:true}
  custody:
    provider-name: ${OAKPAY_CUSTODY_PROVIDER_NAME:}
    webhook-secret: ${OAKPAY_CUSTODY_WEBHOOK_SECRET:}
    webhook-tolerance-seconds: ${OAKPAY_CUSTODY_WEBHOOK_TOLERANCE_SECONDS:300}
